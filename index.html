<!doctype html>
<html lang="en" data-theme="dark">

<head>

  <meta name="robots" content="index, follow" />

    content="MySpace AI is a calm, structured personal workspace integrating your notes, tasks, knowledge documents, and intelligent context." />
  <meta name="twitter:image" content="/twitter-image.jpg" />
  <meta name="twitter:image:alt" content="MySpace AI - Your Mind. Organized." />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MySpace AI",
      "description": "A calm, structured personal workspace integrating notes, tasks, knowledge documents, and intelligent context.",

          "@type": "ImageObject",
          "url": "/logo.png",
          "width": 630,

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <div id="root"></div>
